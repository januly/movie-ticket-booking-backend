spring.application.name=movie-ticket-booking-backend-coursework
server.servlet.context-path=/moviebackend

#Database Configs
spring.datasource.url=jdbc:mysql://localhost:3306/movieBackend2026?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:userpassword123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA configs?/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


