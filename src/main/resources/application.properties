spring.application.name=movie-ticket-booking-backend-coursework
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/moviebackend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_booking?connectionTimeZone=Asia/Colombo}
spring.datasource.username=${DB_USERNAME:movie_booking}
spring.datasource.password=${DB_PASSWORD:userpassword123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
